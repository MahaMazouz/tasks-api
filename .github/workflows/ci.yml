name: CI/CD DevSecOps - tasks-api

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Nom local de l'image, transmis entre les jobs (sans le nom Docker Hub, qui est un secret)
env:
  IMAGE_LOCAL: tasks-api:ci

jobs:
  # ---------------------------------------------------------------
  # 1. Gitleaks : recherche de secrets (TP2)
  # ---------------------------------------------------------------
  gitleaks:
    name: 1. Gitleaks - secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore    
  # ---------------------------------------------------------------
  # 2. Build Maven + tests unitaires (TP1)
  # ---------------------------------------------------------------
  build:
    name: 2. Build Maven + tests
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Java project with Maven
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/tasks-api.jar
          retention-days: 1

  # ---------------------------------------------------------------
  # 3. SonarCloud : SAST + Quality Gate bloquant (TP3)
  # ---------------------------------------------------------------
  sonarcloud:
    name: 3. SonarCloud - SAST + Quality Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Tests + JaCoCo coverage report
        run: mvn -B clean verify

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
  # ---------------------------------------------------------------
  # 4. Docker : build + test du conteneur (TP1 / TP2)
  # ---------------------------------------------------------------
  docker-build-test:
    name: 4. Docker - build + test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Build Docker image
        run: docker build -t "$IMAGE_LOCAL" .

      - name: Test Docker image locally
        run: |
          docker run -d --name tasks-test -p 8081:8080 "$IMAGE_LOCAL"
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8081/ > /dev/null; then break; fi
            sleep 2
          done
          curl -f http://localhost:8081/
          curl -f http://localhost:8081/api/tasks
          docker rm -f tasks-test

      - name: Save image as artifact
        run: docker save "$IMAGE_LOCAL" -o image.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ---------------------------------------------------------------
  # 5. Trivy : CVE de l'image, bloquant (TP2)
  # ---------------------------------------------------------------
  trivy:
    name: 5. Trivy - scan de l'image
    runs-on: ubuntu-latest
    needs: docker-build-test
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LOCAL }}
          format: 'table'
          output: 'trivy-image-report.txt'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Show Trivy report
        if: always()
        run: cat trivy-image-report.txt || true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.txt
          if-no-files-found: ignore

    # ---------------------------------------------------------------
  # 6. SBOM : inventaire des composants de l'image (Syft) - NOUVEAU
  # ---------------------------------------------------------------
  sbom:
    name: 6. SBOM - Syft (CycloneDX)
    runs-on: ubuntu-latest
    needs: docker-build-test
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_LOCAL }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

    # ---------------------------------------------------------------
  # 7. Push Docker Hub : seulement si TOUT est vert, sur main (TP1 / TP2)
  # ---------------------------------------------------------------
  push:
    name: 7. Push Docker Hub
    runs-on: ubuntu-latest
    needs: [sonarcloud, trivy, sbom]
    if: github.event_name == 'push'
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tasks-api
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        id: push
        run: |
          docker tag "$IMAGE_LOCAL" "$IMAGE_NAME:latest"
          docker tag "$IMAGE_LOCAL" "$IMAGE_NAME:${GITHUB_SHA::7}"
          docker push --all-tags "$IMAGE_NAME"
          REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:latest")
          echo "digest=${REF#*@}" >> "$GITHUB_OUTPUT"
          echo "Image poussee : $REF"
  # ---------------------------------------------------------------
  # 8. Cosign : signature de l'image + SBOM attache (sans cle) - NOUVEAU
  # ---------------------------------------------------------------
  sign:
    name: 8. Cosign - signature + attestation SBOM
    runs-on: ubuntu-latest
    needs: push
    permissions:
      contents: read
      id-token: write   # jeton d'identite GitHub (OIDC) utilise par Cosign
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tasks-api
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign the image (keyless)
        run: cosign sign --yes "$IMAGE_NAME@$DIGEST"

      - name: Attach the SBOM as a signed attestation
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate sbom.cyclonedx.json "$IMAGE_NAME@$DIGEST"
  # ---------------------------------------------------------------
  # 9. Cosign : verification de la signature et du SBOM - NOUVEAU
  # ---------------------------------------------------------------
  verify:
    name: 9. Cosign - verification
    runs-on: ubuntu-latest
    needs: [push, sign]
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tasks-api
      DIGEST: ${{ needs.push.outputs.digest }}
      IDENTITY: ^https://github.com/${{ github.repository }}/
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify the signature
        run: |
          cosign verify "$IMAGE_NAME@$DIGEST" \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" > /dev/null
          echo "Signature valide : image signee par le workflow de ${{ github.repository }}"

      - name: Verify the SBOM attestation
        run: |
          cosign verify-attestation "$IMAGE_NAME@$DIGEST" --type cyclonedx \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" > /dev/null
          echo "SBOM authentique : attestation CycloneDX verifiee"